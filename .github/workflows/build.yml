name: build

# Builds the thin-edge.io Router App for every supported Advantech ICR platform.
#
#   v2i  armv5   |  v3  armv7   |  v4  aarch64  |  v4i  aarch64 (ICR-1642)
#
# Each matrix job sets up the Advantech build environment (cross toolchains +
# Router App SDK) exactly like scripts/setup-build-env.sh and produces the
# platform module (images/tedge/) plus any extension modules discovered from
# modules/Rules.mk, uploaded as build artifacts. Pushes to main and version tags
# (v*) also publish the Router Apps as raw .tgz GitHub Release assets.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [v2i, v3, v4, v4i]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Checked out into a subdirectory so the Advantech SDK can be cloned
          # alongside it (the build expects ../ModulesSDK).
          path: advantec-tedge-router-app

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git make pkg-config build-essential cryptsetup-bin curl ccache

      - name: Fetch and install Advantech cross toolchains
        run: |
          git clone --depth 1 https://bitbucket.org/bbsmartworx/Toolchains.git
          sudo dpkg -i Toolchains/deb/*.deb

      - name: Fetch Router App SDK and build its library for ${{ matrix.platform }}
        run: |
          git clone --depth 1 https://bitbucket.org/bbsmartworx/ModulesSDK.git
          make -C ModulesSDK/library PLATFORM=${{ matrix.platform }}

      - name: Build Router App (${{ matrix.platform }})
        working-directory: advantec-tedge-router-app
        run: make PLATFORMS="${{ matrix.platform }}"

      - name: Show build output
        working-directory: advantec-tedge-router-app
        run: ls -lR images/

      - name: Upload Router Apps
        uses: actions/upload-artifact@v4
        with:
          # The platform module (tedge) and any extension modules are discovered
          # from modules/Rules.mk and built by the step above. NOTE: GitHub zips
          # this artifact on download; for a raw .tgz use the Release assets
          # (see the release job) or `gh run download`.
          name: routerapps-${{ matrix.platform }}
          path: advantec-tedge-router-app/images/*/*.${{ matrix.platform }}.tgz
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    # Publish the built Router Apps as GitHub *Release* assets, which are served
    # as-is -- a raw, directly-downloadable `.tgz` with NO zip envelope (unlike
    # CI run artifacts, which GitHub always wraps in a .zip). A version tag makes
    # a normal release; a push to main (or a manual run) refreshes a rolling
    # "latest" prerelease so the newest tarballs are always one click away. PR
    # builds get only the (zipped) CI artifact from the build job above.
    if: >-
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/') ||
       github.ref == 'refs/heads/main' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all Router Apps
        uses: actions/download-artifact@v4
        with:
          # Downloading via actions/download-artifact extracts the artifacts, so
          # `artifacts/**/*.tgz` are the raw tarballs (not the zipped envelope).
          path: artifacts

      - name: Publish versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tgz
          generate_release_notes: true

      - name: Refresh rolling "latest" build (main / manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: artifacts/**/*.tgz
